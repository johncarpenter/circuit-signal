[project]
name = "batch-runner"
version = "0.1.0"
description = "CLI batch runner for pre-computing signal discovery baselines"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "data-loader-mcp[all]",
    "signal-discovery-mcp[all]",
    "data-prep",
]

[project.scripts]
batch-runner = "batch_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batch_runner"]

[tool.uv.sources]
data-loader-mcp = { path = "../mcp/layer0", editable = true }
signal-discovery-mcp = { path = "../mcp/layer1", editable = true }
data-prep = { path = "../data_prep", editable = true }
