[project]
name = "data-prep"
version = "0.1.0"
description = "Data preparation pipeline: TDV profiling, entity normalization, and plan building"
requires-python = ">=3.12"
dependencies = [
    "tdv-profiler",
    "rapidfuzz>=3.0",
    "networkx>=3.0",
    "duckdb>=1.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
llm = ["anthropic>=0.30"]

[project.scripts]
data-prep = "data_prep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_prep"]

[tool.uv.sources]
tdv-profiler = { path = "../tdv_profiler", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "data-prep[llm]",
]
