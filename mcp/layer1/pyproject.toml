[project]
name = "signal-discovery-mcp"
version = "0.1.0"
description = "MCP server for autonomous time-series signal discovery"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "ruptures>=1.1",
    "stumpy>=1.12",
    "pyarrow>=14.0",
    "mcp[cli]>=1.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
forecast = ["prophet>=1.1"]
viz = ["plotly>=5.0", "kaleido>=0.2"]
all = ["prophet>=1.1", "plotly>=5.0", "kaleido>=0.2", "duckdb>=0.9"]

[project.scripts]
signal-discovery = "signal_discovery.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_discovery"]
