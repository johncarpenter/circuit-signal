[project]
name = "data-loader-mcp"
version = "0.1.0"
description = "MCP server for loading, segmenting, and aggregating raw transactional data into time series"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "mcp[cli]>=1.0",
]

[project.optional-dependencies]
duckdb = ["duckdb>=0.9"]
clean = ["rapidfuzz>=3.0", "anthropic>=0.40"]
all = ["duckdb>=0.9", "rapidfuzz>=3.0", "anthropic>=0.40"]

[project.scripts]
data-loader = "data_loader.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_loader"]
