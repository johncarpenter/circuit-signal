[project]
name = "signal-correlation-mcp"
version = "0.1.0"
description = "MCP server for cross-dataset signal correlation (Layer 2)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.9",
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "mcp[cli]>=1.0",
]

[project.optional-dependencies]
full = ["statsmodels>=0.14", "geopy>=2.4", "plotly>=5.0"]

[project.scripts]
signal-correlation = "signal_correlation.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_correlation"]
