[project]
name = "query-planner-mcp"
version = "0.1.0"
description = "MCP server for TDV graph querying and temporal-aware dataset joins"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "duckdb>=1.0",
    "pandas>=2.0",
    "mcp[cli]>=1.0",
]

[project.scripts]
query-planner = "query_planner.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_planner"]
