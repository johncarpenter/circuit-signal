[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "circuit-api"
version = "0.1.0"
description = "Circuit Signal API Gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "arq>=0.26",
    "aioboto3>=13.0",
    "redis>=5.0",
    "pgvector>=0.3",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.7",
    "circuit-core",
]

[tool.hatch.build.targets.wheel]
packages = ["src/circuit_api"]
