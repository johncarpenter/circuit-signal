[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "circuit-core"
version = "0.1.0"
description = "Circuit Signal analytical core library"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "ruptures>=1.1",
    "networkx>=3.0",
    "rapidfuzz>=3.0",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
]

[project.optional-dependencies]
forecast = ["prophet>=1.1"]
matrix-profile = ["stumpy>=1.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/circuit_core"]
