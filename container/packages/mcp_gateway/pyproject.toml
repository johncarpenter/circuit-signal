[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "circuit-mcp-gateway"
version = "0.1.0"
description = "Circuit Signal MCP Gateway — SSE transport for signal queries"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "circuit-core",
]

[tool.hatch.build.targets.wheel]
packages = ["src/circuit_mcp"]
